<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設定</title>
<script src="/socket.io/socket.io.js"></script>
<script src="/vendor/vue.global.js"></script>
<link rel="stylesheet" href="/panel.css">
<style>
  .layout { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start; }
  .side { flex: 0 0 200px; width: 200px; }
  .content {
    flex: 1 1 280px; min-width: 280px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(760px, 100%), 1fr));
    gap: 1rem;
    align-content: start;
  }
  .card-full { grid-column: 1 / -1; }

  .side { background: var(--panel); border-radius: 10px; padding: 0.5rem; }
  .side button {
    display: block; width: 100%; text-align: left; padding: 0.7rem 0.9rem;
    background: transparent; border: none; color: var(--dim);
    font-size: 0.95rem; border-radius: 6px; margin-bottom: 0.2rem;
  }
  .side button.on { background: #2c313b; color: var(--text); }
  .side .group { color: var(--dim); font-size: 0.75rem; padding: 0.6rem 0.9rem 0.2rem; }

  .block { border: 1px solid var(--line); border-radius: 8px; padding: 0.9rem; margin-bottom: 0.8rem; }
  .block h3 { margin: 0 0 0.7rem; font-size: 0.95rem; font-weight: normal; color: var(--text); }
  .block .row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
  .block .row > label { flex: 0 1 4rem; min-width: 3.5rem; font-size: 0.9rem; color: var(--dim); }
  .block select { flex: 1 1 160px; min-width: 140px; }

  .block-body { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-start; }
  .block-font-col { flex: 1 1 220px; min-width: 200px; }
  .block-pos-col { flex: 0 0 auto; }

  /* 2つずつ・3つずつ、どちらのグループでも使う共通の並びグリッド。
     画面が狭いときは自然に1列へ折り返す */
  .block-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr));
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .block-row:last-child { margin-bottom: 0; }

  .danger { background: var(--danger); border-color: #991b1b; padding: 0.9rem 1.5rem; font-size: 1rem; }

  .stepper { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .stepper button { width: 2.4rem; height: 2.4rem; font-size: 1.3rem; font-weight: bold; flex-shrink: 0; }
  .stepper .val {
    min-width: 3rem; text-align: center; font-size: 1.15rem;
    font-variant-numeric: tabular-nums;
  }
  .stepper .reset {
    width: auto; height: 2.4rem; padding: 0 0.7rem; font-size: 0.8rem; font-weight: normal;
  }

  .counter-row { flex-wrap: wrap; }
  .counter-row label { transition: color 0.15s ease; }
  .counter-row label.maxed { color: var(--away); font-weight: bold; }

  .switch {
    position: relative; display: inline-block; flex-shrink: 0;
    width: 122px; height: 38px; border-radius: 19px;
    border: none; cursor: pointer; padding: 0;
    transition: background-color 0.2s ease;
  }
  .switch-label {
    position: absolute; top: 0; bottom: 0; width: 87px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem; font-weight: bold; color: #fff;
    transition: left 0.2s ease; pointer-events: none;
  }
  .switch.on  .switch-label { left: 0; }
  .switch.off .switch-label { left: 35px; }
  .switch-knob {
    position: absolute; top: 3px; width: 32px; height: 32px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.35);
    transition: left 0.2s ease; pointer-events: none;
  }
  .switch.on  .switch-knob { left: 87px; }
  .switch.off .switch-knob { left: 3px; }

  .pos-section-label { font-size: 0.9rem; color: var(--dim); margin-bottom: 0.4rem; }
  .pos-step { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; }
  .pos-step-label { font-size: 0.82rem; color: var(--dim); }
  .pos-step select { width: auto; padding: 0.35rem 0.5rem; font-size: 0.85rem; }

  .dpad {
    display: grid;
    grid-template-columns: 56px 56px 56px;
    grid-template-rows: 56px 56px 56px;
    gap: 8px;
    width: 188px;
  }
  .dpad-btn {
    width: 56px; height: 56px; border-radius: 14px;
    background: #0f1115; border: 1px solid var(--line); color: var(--text);
    font-size: 1.4rem; line-height: 1; display: flex;
    align-items: center; justify-content: center; cursor: pointer;
  }
  .dpad-btn:active { background: #343842; }
  .dpad-up     { grid-column: 2; grid-row: 1; }
  .dpad-left   { grid-column: 1; grid-row: 2; }
  .dpad-center { grid-column: 2; grid-row: 2; }
  .dpad-right  { grid-column: 3; grid-row: 2; }
  .dpad-down   { grid-column: 2; grid-row: 3; }
  .dpad-reset {
    font-size: 0.72rem; font-weight: normal; line-height: 1.2;
    padding: 2px; text-align: center; word-break: keep-all;
  }

  .pos-readout {
    width: 188px; text-align: center; margin-top: 0.6rem;
    font-size: 0.82rem; color: var(--dim); font-variant-numeric: tabular-nums;
  }

  .color-picker { margin-top: 0.7rem; }
  .color-picker-head { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
  .color-swatch { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line); flex-shrink: 0; }
  .color-hex { font-size: 0.82rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  .color-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.35rem; }
  .color-row label {
    width: 1.1rem; font-size: 0.82rem; font-weight: bold; text-align: center; flex-shrink: 0;
  }
  .color-row.r label { color: #ff6b6b; }
  .color-row.g label { color: #51cf66; }
  .color-row.b label { color: #4dabf7; }
  .color-row input[type=range] { flex: 1 1 auto; min-width: 90px; }
  .color-row .color-val {
    width: 2.6rem; text-align: right; font-size: 0.8rem; color: var(--dim);
    font-variant-numeric: tabular-nums; flex-shrink: 0;
  }
  .color-row.r input[type=range] { accent-color: #ff6b6b; }
  .color-row.g input[type=range] { accent-color: #51cf66; }
  .color-row.b input[type=range] { accent-color: #4dabf7; }

  .anim-row { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.7rem; }
  .anim-row label { font-size: 0.82rem; color: var(--dim); }
</style>
</head>
<body>

<div id="app" v-cloak>
  <nav class="nav">
    <a href="/">入口</a>
    <a href="/input.html">得点入力</a>
    <a href="/config.html" class="here">設定</a>
  </nav>

  <div class="status" :class="connected ? 'on' : 'off'">
    {{ connected ? '接続済み' : '⚠ 切断されました — 操作は反映されません' }}
  </div>

  <div v-if="state" class="layout">

    <div class="side">
      <div class="group">試合</div>
      <button :class="{ on: tab === 'match' }" @click="tab = 'match'">試合設定</button>
      <div class="group">表示の管理</div>
      <button v-for="d in state.displayDefs" :key="d.id"
              :class="{ on: tab === d.id }" @click="tab = d.id">{{ d.label }}</button>
    </div>

    <div class="content">
      <template v-if="tab === 'match'">
        <div class="card">
          <h2>試合形式</h2>
          <div class="field">
            <label>セット数</label>
            <stepper :value="state.rules.format" :min="1" :max="9"
                     suffix="セットマッチ" @change="setRule('format', $event)"></stepper>
          </div>
          <div class="field">
            <label>通常セット</label>
            <stepper :value="state.rules.pointsToWin" :min="1" :max="99"
                     suffix="点先取" @change="setRule('pointsToWin', $event)"></stepper>
          </div>
          <div class="field">
            <label>最終セット</label>
            <stepper :value="state.rules.finalSetPoints" :min="1" :max="99"
                     suffix="点先取" @change="setRule('finalSetPoints', $event)"></stepper>
          </div>
          <p class="hint">
            設定したセット数をすべて消化した時点で試合を終了します。
            2セット・4セットなど偶数の場合、決着がつかなくても構わず
            全セットをプレイします。
          </p>
        </div>

        <div class="card">
          <h2>1セットあたりの回数</h2>
          <div v-for="c in counterDefs" :key="c.kind" class="field counter-row">
            <label :class="{ maxed: isMaxed(c) }">{{ c.label }}</label>
            <stepper :value="state.rules[c.max]" :min="0" :max="c.cap"
                     suffix="回" @change="setRule(c.max, $event)"></stepper>

            <toggle-switch :value="state.rules.counterDisplay[c.kind].visible"
                           on-text="表示" off-text="非表示"
                           on-color="var(--ok)" off-color="#4b4f58"
                           @change="setVisible(c.kind, $event)"></toggle-switch>

            <toggle-switch :value="state.rules.counterDisplay[c.kind].mode === 'used'"
                           on-text="加算" off-text="減算"
                           on-color="var(--away)" off-color="var(--home)"
                           @change="setMode(c.kind, $event)"></toggle-switch>
          </div>
          <p class="hint">
            いずれかのチームが上限まで使い切ると、項目名が赤く表示されます。
            表示/非表示と加算・減算は、タイムアウト・選手交代・チャレンジそれぞれで個別に設定でき、
            すべての表示パターンに共通で反映されます。
          </p>
        </div>

        <div class="card card-full">
          <h2>試合のやり直し</h2>
          <button class="danger" @click="resetMatch">試合をリセット</button>
          <p class="hint" style="margin-bottom:0">
            スコアとセット結果が消えます。チーム名・試合設定・表示の管理は残ります。
          </p>
        </div>
      </template>

      <template v-else-if="display">
        <div class="card">
          <h2>{{ currentDef.label }}</h2>
          <p class="hint">
            確認用:
            <a :href="'/' + currentDef.file" target="_blank"
               style="color:var(--dim)">{{ currentDef.file }} を開く</a>
          </p>
          <p class="hint" style="margin-bottom:0">
            フォントは項目ごとに個別に設定できます。
            server/public/fonts/ に .woff2 / .otf / .ttf を置くと選択肢に出ます
            (フォルダに分けて置いても構いません)。
          </p>
        </div>

        <div class="card card-full">
          <h2>ブロックごとの調整</h2>

          <template v-if="currentDef.id === 'full'">
            <p class="hint">
              位置は矢印ボタンで動かします。「チーム名」「得点」「セット結果」は
              中央から寄せる/広げる形、「サーブ権表示」はサイズを変えても常に得点欄の中心を保ちます。
              「タイムアウト、選手交代、チャレンジ」はそのまま左右/上下に動きます。
            </p>

            <div class="block-row">
              <block-editor v-for="b in rowNameScore" :key="b.key"
                            :label="b.label" :block="display.blocks[b.key]" :fonts="fonts"
                            :size-min="b.min" :size-max="b.max" :default-size="b.defaultSize"
                            :show-animate="!!b.animateToggle"
                            @change="setBlock(b.key, $event)"></block-editor>
            </div>

            <div class="block-row">
              <block-editor v-for="b in rowResultServe" :key="b.key"
                            :label="b.label" :block="display.blocks[b.key]" :fonts="fonts"
                            :hide-font="!!b.hideFont"
                            :size-min="b.min" :size-max="b.max" :default-size="b.defaultSize"
                            @change="setBlock(b.key, $event)"></block-editor>
            </div>

            <block-editor v-if="counterDef" :label="counterDef.label"
                          :block="display.blocks[counterDef.key]" :fonts="fonts"
                          :size-min="counterDef.min" :size-max="counterDef.max"
                          :default-size="counterDef.defaultSize"
                          :show-style="currentDef.counterStyleOption"
                          @change="setBlock(counterDef.key, $event)"></block-editor>
          </template>

          <template v-else-if="currentDef.id === 'result'">
            <p class="hint">
              位置は矢印ボタンで動かします。「チーム名」「獲得セット数」「セット結果表」は
              すべて中央から寄せる/広げる形で動きます。この画面は disp-full.html /
              disp-full-flip.html とは独立した設定です(互いに影響しません)。
            </p>
            <div class="block-row">
              <block-editor v-for="b in resultBlockDefs" :key="b.key"
                            :label="b.label" :block="display.blocks[b.key]" :fonts="fonts"
                            :size-min="b.min" :size-max="b.max" :default-size="b.defaultSize"
                            @change="setBlock(b.key, $event)"></block-editor>
            </div>
          </template>
        </div>
      </template>
    </div>
  </div>
</div>

<script>
const { createApp, ref, computed } = Vue;

const COUNTER_DEFS = [
  { kind: 'timeouts',   label: 'タイムアウト', max: 'timeoutsPerSet',   cap: 9 },
  { kind: 'subs',       label: '選手交代',     max: 'subsPerSet',       cap: 20 },
  { kind: 'challenges', label: 'チャレンジ',   max: 'challengesPerSet', cap: 9 }
];

// animateToggle: true の項目にだけ「得点時のアニメーション」トグルが表示される
// hideFont: true の項目はフォント選択欄を出さない(文字ではないブロック用)
const FULL_BLOCK_DEFS = [
  { key: 'name',    label: 'チーム名',                         min: 20, max: 200, defaultSize: 76 },
  { key: 'score',   label: '得点',                             min: 60, max: 700, defaultSize: 410, animateToggle: true },
  { key: 'result',  label: 'セット結果',                       min: 20, max: 300, defaultSize: 124 },
  { key: 'serve',   label: 'サーブ権表示',                     min: 20, max: 500, defaultSize: 150, hideFont: true },
  { key: 'counter', label: 'タイムアウト、選手交代、チャレンジ', min: 20, max: 300, defaultSize: 124 }
];

const RESULT_BLOCK_DEFS = [
  { key: 'name',    label: 'チーム名',     min: 20, max: 200, defaultSize: 76 },
  { key: 'setsWon', label: '獲得セット数', min: 40, max: 700, defaultSize: 500 },
  { key: 'table',   label: 'セット結果表', min: 20, max: 300, defaultSize: 124 }
];

const Stepper = {
  props: {
    value:      { type: Number, required: true },
    min:        { type: Number, default: 0 },
    max:        { type: Number, default: 99 },
    step:       { type: Number, default: 1 },
    suffix:     { type: String, default: '' },
    resetValue: { type: Number, default: null }
  },
  emits: ['change'],
  template: `
    <div class="stepper">
      <button type="button" :disabled="value <= min"
              @click="$emit('change', Math.max(min, value - step))">−</button>
      <span class="val">{{ value }}</span>
      <button type="button" :disabled="value >= max"
              @click="$emit('change', Math.min(max, value + step))">+</button>
      <span v-if="suffix" class="unit">{{ suffix }}</span>
      <button v-if="resetValue !== null" type="button" class="reset"
              :disabled="value === resetValue"
              @click="$emit('change', resetValue)">リセット</button>
    </div>
  `
};

const ToggleSwitch = {
  props: {
    value:    { type: Boolean, required: true },
    onText:   { type: String, default: 'ON' },
    offText:  { type: String, default: 'OFF' },
    onColor:  { type: String, default: 'var(--ok)' },
    offColor: { type: String, default: '#4b4f58' }
  },
  emits: ['change'],
  template: `
    <button type="button" class="switch" :class="value ? 'on' : 'off'"
            :style="{ backgroundColor: value ? onColor : offColor }"
            :aria-pressed="value" @click="$emit('change', !value)">
      <span class="switch-label">{{ value ? onText : offText }}</span>
      <span class="switch-knob"></span>
    </button>
  `
};

const PositionDPad = {
  props: {
    x:     { type: Number, required: true },
    y:     { type: Number, required: true },
    range: { type: Number, default: 400 }
  },
  emits: ['change'],
  data() {
    return { step: 1 };
  },
  methods: {
    clamp(v) { return Math.min(this.range, Math.max(-this.range, v)); },
    move(dx, dy) {
      this.$emit('change', { x: this.clamp(this.x + dx), y: this.clamp(this.y + dy) });
    },
    reset() {
      this.$emit('change', { x: 0, y: 0 });
    }
  },
  template: `
    <div>
      <div class="pos-step">
        <span class="pos-step-label">移動量</span>
        <select v-model.number="step">
          <option :value="1">1px</option>
          <option :value="10">10px</option>
          <option :value="100">100px</option>
        </select>
      </div>
      <div class="dpad">
        <button type="button" class="dpad-btn dpad-up"     @click="move(0, -step)">▲</button>
        <button type="button" class="dpad-btn dpad-left"   @click="move(-step, 0)">◀</button>
        <button type="button" class="dpad-btn dpad-center dpad-reset" @click="reset">リセット</button>
        <button type="button" class="dpad-btn dpad-right"  @click="move(step, 0)">▶</button>
        <button type="button" class="dpad-btn dpad-down"   @click="move(0, step)">▼</button>
      </div>
      <div class="pos-readout">x: {{ x }} / y: {{ y }}</div>
    </div>
  `
};

function toHex2(n) {
  return Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, '0');
}
function rgbOf(hex) {
  const m = /^#([0-9a-fA-F]{2})([0-9a-fA-F]{2})([0-9a-fA-F]{2})$/.exec(hex || '#000000');
  if (!m) return { r: 0, g: 0, b: 0 };
  return { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) };
}

const BlockEditor = {
  components: { stepper: Stepper, 'toggle-switch': ToggleSwitch, 'position-dpad': PositionDPad },
  props: {
    label:       { type: String, required: true },
    block:       { type: Object, required: true },
    fonts:       { type: Array,  default: () => [] },
    sizeMin:     { type: Number, default: 20 },
    sizeMax:     { type: Number, default: 300 },
    defaultSize: { type: Number, required: true },
    showStyle:   { type: Boolean, default: false },
    showAnimate: { type: Boolean, default: false },
    hideFont:    { type: Boolean, default: false }
  },
  emits: ['change'],
  computed: {
    rgb() { return rgbOf(this.block.color); }
  },
  methods: {
    onColor(channel, value) {
      const cur = { ...this.rgb };
      cur[channel] = Number(value);
      this.$emit('change', { color: '#' + toHex2(cur.r) + toHex2(cur.g) + toHex2(cur.b) });
    }
  },
  template: `
    <div class="block">
      <h3>{{ label }}</h3>
      <div class="block-body">
        <div class="block-font-col">
          <div class="row" v-if="!hideFont">
            <label>フォント</label>
            <select :value="block.font" @change="$emit('change', { font: $event.target.value })">
              <option value="system">システム標準</option>
              <option v-for="f in fonts" :key="f.file" :value="f.file">{{ f.name }}</option>
            </select>
          </div>

          <div class="row" v-if="showStyle">
            <label>表示形式</label>
            <toggle-switch :value="block.style === 'lamp'" on-text="ランプ" off-text="数字"
                           on-color="var(--warn)" off-color="#4b4f58"
                           @change="$emit('change', { style: $event ? 'lamp' : 'number' })"></toggle-switch>
          </div>

          <div class="row">
            <label>サイズ</label>
            <stepper :value="block.size" :min="sizeMin" :max="sizeMax" :step="2" suffix="px"
                     :reset-value="defaultSize" @change="$emit('change', { size: $event })"></stepper>
          </div>

          <div class="color-picker">
            <div class="color-picker-head">
              <div class="color-swatch" :style="{ background: block.color }"></div>
              <span class="color-hex">{{ block.color }}</span>
            </div>
            <div class="color-row r">
              <label>R</label>
              <input type="range" min="0" max="255" :value="rgb.r" @input="onColor('r', $event.target.value)">
              <span class="color-val">{{ rgb.r }}</span>
            </div>
            <div class="color-row g">
              <label>G</label>
              <input type="range" min="0" max="255" :value="rgb.g" @input="onColor('g', $event.target.value)">
              <span class="color-val">{{ rgb.g }}</span>
            </div>
            <div class="color-row b">
              <label>B</label>
              <input type="range" min="0" max="255" :value="rgb.b" @input="onColor('b', $event.target.value)">
              <span class="color-val">{{ rgb.b }}</span>
            </div>
          </div>

          <div class="anim-row" v-if="showAnimate">
            <label>得点時のアニメーション</label>
            <toggle-switch :value="block.animate !== false" on-text="ON" off-text="OFF"
                           on-color="var(--ok)" off-color="#4b4f58"
                           @change="$emit('change', { animate: $event })"></toggle-switch>
          </div>
        </div>

        <div class="block-pos-col">
          <div class="pos-section-label">位置</div>
          <position-dpad :x="block.x" :y="block.y" @change="$emit('change', $event)"></position-dpad>
        </div>
      </div>
    </div>
  `
};

createApp({
  setup() {
    const state = ref(null);
    const connected = ref(false);
    const fonts = ref([]);
    const tab = ref('match');
    const socket = io();

    socket.on('state', (s) => { state.value = s; });
    socket.on('connect', () => { connected.value = true; });
    socket.on('disconnect', () => { connected.value = false; });

    fetch('/api/fonts').then((r) => r.json()).then((list) => { fonts.value = list; });

    const currentDef = computed(() =>
      state.value ? state.value.displayDefs.find((d) => d.id === tab.value) : null);

    const display = computed(() =>
      state.value && currentDef.value ? state.value.displays[tab.value] : null);

    // 「チーム名」「得点」が1行、「セット結果」「サーブ権表示」が1行、
    // 「タイムアウト等」が単独の1行、という固定の並びにする
    const rowNameScore = computed(() => FULL_BLOCK_DEFS.filter((b) => ['name', 'score'].includes(b.key)));
    const rowResultServe = computed(() => FULL_BLOCK_DEFS.filter((b) => ['result', 'serve'].includes(b.key)));
    const counterDef = computed(() => FULL_BLOCK_DEFS.find((b) => b.key === 'counter'));
    const resultBlockDefs = RESULT_BLOCK_DEFS;

    const setRule = (key, value) => socket.emit('rules:set', { [key]: value });

    function isMaxed(c) {
      const s = state.value;
      if (!s) return false;
      const limit = s.rules[c.max];
      return s.home[c.kind] >= limit || s.away[c.kind] >= limit;
    }

    function setVisible(kind, val) {
      socket.emit('rules:set', { counterDisplay: { [kind]: { visible: val } } });
    }

    function setMode(kind, val) {
      socket.emit('rules:set', { counterDisplay: { [kind]: { mode: val ? 'used' : 'remaining' } } });
    }

    const setDisplay = (patch) => socket.emit('display:set', { id: tab.value, patch });
    const setBlock = (key, val) => setDisplay({ blocks: { [key]: val } });

    function resetMatch() {
      if (confirm('試合を最初からやり直します。スコアとセット結果が消えます。よろしいですか？')) {
        socket.emit('match:reset');
      }
    }

    return { state, connected, fonts, tab, currentDef, display,
             counterDefs: COUNTER_DEFS, rowNameScore, rowResultServe, counterDef, resultBlockDefs,
             setRule, isMaxed, setVisible, setMode, setDisplay, setBlock, resetMatch };
  }
})
.component('stepper', Stepper)
.component('toggle-switch', ToggleSwitch)
.component('position-dpad', PositionDPad)
.component('block-editor', BlockEditor)
.mount('#app');
</script>
</body>
</html>
