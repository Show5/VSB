<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>表示：フルスクリーン</title>
<script src="/socket.io/socket.io.js"></script>
<script src="/vendor/vue.global.js"></script>
<style>
  [v-cloak] { display: none; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%;
               background: transparent; overflow: hidden; }
  #stage {
    position: absolute; top: 0; left: 0; width: 1920px; height: 1080px;
    transform-origin: top left; color: #000;
    font-variant-numeric: tabular-nums;
    opacity: 0; transition: opacity 0.4s ease;
  }
  #stage.ready { opacity: 1; }
  .abs { position: absolute; display: flex; }
  .name { width: 792px; height: 165px; align-items: center; justify-content: center;
          font-weight: 700; line-height: 1.15; text-align: center;
          overflow: hidden; word-break: break-word; white-space: pre-line; }
  .score { width: 429px; height: 420px; align-items: center; justify-content: center;
           font-weight: 800; line-height: 1; }
  .dash { width: 127px; height: 31px; background: #000; }
  .result { width: 369px; height: 90px; align-items: center; justify-content: center;
            font-weight: 700; line-height: 1; }
  .result .n { width: 138px; text-align: center; }
  .result .n + .n { margin-left: 24px; }
  .result .sep { width: 47px; display: flex; align-items: center; justify-content: center; }
  .result .sep i { display: block; width: 38px; height: 9px; background: #000; }
  .counter { width: 173px; height: 110px; align-items: center; justify-content: center;
             font-weight: 700; line-height: 1; }
</style>
</head>
<body>

<div id="app" v-cloak>
  <div id="stage" :class="{ ready: visible }"
       :style="{ transform: `scale(${scale})`, fontFamily: fontStack }">
    <template v-if="state">

      <div class="abs name" :style="pos(140, 39, 'name')">{{ state.home.name }}</div>
      <div class="abs name" :style="pos(980, 39, 'name')">{{ state.away.name }}</div>

      <div class="abs score" :style="pos(327, 180, 'score')">{{ state.home.score }}</div>
      <div class="abs dash"  :style="pos(896, 404, 'score')"></div>
      <div class="abs score" :style="pos(1167, 180, 'score')">{{ state.away.score }}</div>

      <div v-for="c in counters" :key="c.key" class="abs counter"
           :style="{ ...pos(c.left, c.top, 'counter'), color: c.maxed ? MAX_COLOR : 'inherit' }">
        {{ c.value }}
      </div>

      <div v-for="(r, i) in results" :key="i" class="abs result"
           :style="pos(775.5, 610 + i * 108, 'result')">
        <div class="n">{{ r.home }}</div>
        <div class="sep"><i></i></div>
        <div class="n">{{ r.away }}</div>
      </div>

    </template>
  </div>
</div>

<script>
const { createApp, ref, computed, onMounted } = Vue;

const DISPLAY_ID = 'full';
const SYSTEM_STACK = '"Helvetica Neue", "Avenir Next", "Hiragino Sans", sans-serif';
const COUNTERS = [
  { kind: 'timeouts',   max: 'timeoutsPerSet',   top: 634 },
  { kind: 'subs',       max: 'subsPerSet',       top: 774 },
  { kind: 'challenges', max: 'challengesPerSet', top: 914 }
];
const COL_X = { home: 50, away: 1687 };
const MAX_COLOR = '#ef4444';

createApp({
  setup() {
    const state = ref(null);
    const connected = ref(false);
    const scale = ref(1);

    const conf = computed(() => state.value ? state.value.displays[DISPLAY_ID] : null);
    const blocks = computed(() => conf.value ? conf.value.blocks : null);
    const visible = computed(() => connected.value && state.value !== null);

    const fontStack = computed(() => {
      const font = conf.value ? conf.value.font : 'system';
      if (!font || font === 'system') return SYSTEM_STACK;
      applyFontFace(font);
      return `"disp-custom", ${SYSTEM_STACK}`;
    });

    let loadedFont = null;
    function applyFontFace(file) {
      if (loadedFont === file) return;
      loadedFont = file;
      let el = document.getElementById('font-face');
      if (!el) {
        el = document.createElement('style');
        el.id = 'font-face';
        document.head.appendChild(el);
      }
      el.textContent =
        `@font-face { font-family: "disp-custom"; font-display: block;` +
        ` src: url("/fonts/${encodeURIComponent(file)}"); }`;
    }

    function pos(left, top, key) {
      const b = blocks.value[key];
      return {
        left: (left + b.x) + 'px',
        top: (top + b.y) + 'px',
        fontSize: b.size + 'px'
      };
    }

    const results = computed(() =>
      state.value ? state.value.setResults.slice(0, 4) : []);

    const counters = computed(() => {
      const s = state.value;
      if (!s) return [];
      const list = [];
      for (const team of ['home', 'away']) {
        for (const c of COUNTERS) {
          const cd = s.rules.counterDisplay[c.kind];
          if (!cd.visible) continue;
          const used = s[team][c.kind];
          const max = s.rules[c.max];
          list.push({
            key: team + c.kind,
            left: COL_X[team],
            top: c.top,
            value: cd.mode === 'used' ? used : max - used,
            maxed: used >= max
          });
        }
      }
      return list;
    });

    function fit() {
      scale.value = Math.min(window.innerWidth / 1920, window.innerHeight / 1080, 1);
    }

    const socket = io();
    socket.on('state', (s) => { state.value = s; });
    socket.on('connect', () => { connected.value = true; });
    socket.on('disconnect', () => { connected.value = false; });

    onMounted(() => { fit(); window.addEventListener('resize', fit); });

    return { state, blocks, visible, scale, fontStack, results, counters, pos, MAX_COLOR };
  }
}).mount('#app');
</script>
</body>
</html>
