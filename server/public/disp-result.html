<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>表示：試合結果</title>
<script src="/socket.io/socket.io.js"></script>
<script src="/vendor/vue.global.js"></script>
<style>
  [v-cloak] { display: none; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%;
               background: transparent; overflow: hidden; }
  #stage {
    position: absolute; top: 0; left: 0; width: 1920px; height: 1080px;
    transform-origin: top left;
    font-variant-numeric: tabular-nums;
    opacity: 0; transition: opacity 0.4s ease;
  }
  #stage.ready { opacity: 1; }
  .abs { position: absolute; display: flex; }
  .name { width: 740px; height: 180px; align-items: center; justify-content: center;
          font-weight: 700; line-height: 1.15; text-align: center;
          overflow: hidden; word-break: break-word; }
  .setsnum { width: 280px; height: 240px; align-items: center; justify-content: center;
             font-weight: 800; line-height: 1; }
  .setsdash { width: 80px; height: 16px; }
  .rownum { width: 220px; height: 64px; align-items: center; justify-content: center;
            font-weight: 700; line-height: 1; }
  .rowdash { width: 60px; height: 10px; }
</style>
</head>
<body>

<div id="app" v-cloak>
  <div id="stage" :class="{ ready: visible }" :style="{ transform: `scale(${scale})` }">
    <template v-if="state">

      <div class="abs name" :style="spreadPos(100, 'left', 70, 'name')">{{ displayName('home') }}</div>
      <div class="abs name" :style="spreadPos(1080, 'right', 70, 'name')">{{ displayName('away') }}</div>

      <div class="abs setsnum" :style="spreadPos(640, 'left', 340, 'setsWon')">{{ state.home.setsWon }}</div>
      <div class="abs setsdash" :style="fixedPos(920, 452, blocks.setsWon.color)"></div>
      <div class="abs setsnum" :style="spreadPos(1000, 'right', 340, 'setsWon')">{{ state.away.setsWon }}</div>

      <template v-for="(r, i) in results" :key="i">
        <div class="abs rownum" :style="spreadPos(710, 'left', 640 + i * 84, 'table')">{{ r.home }}</div>
        <div class="abs rowdash" :style="fixedPos(930, 640 + i * 84 + 27, blocks.table.color)"></div>
        <div class="abs rownum" :style="spreadPos(990, 'right', 640 + i * 84, 'table')">{{ r.away }}</div>
      </template>

    </template>
  </div>
</div>

<script>
const { createApp, ref, computed, onMounted } = Vue;

const DISPLAY_ID = 'result';
const SYSTEM_STACK = '"Helvetica Neue", "Avenir Next", "Hiragino Sans", sans-serif';
const BLOCK_KEYS = ['name', 'setsWon', 'table'];

createApp({
  setup() {
    const state = ref(null);
    const connected = ref(false);
    const scale = ref(1);

    const conf = computed(() => state.value ? state.value.displays[DISPLAY_ID] : null);
    const blocks = computed(() => conf.value ? conf.value.blocks : null);
    const visible = computed(() => connected.value && state.value !== null);

    function fontFamilyFor(key) {
      const b = blocks.value[key];
      if (!b || !b.font || b.font === 'system') return SYSTEM_STACK;
      return `"disp-font-${key}", ${SYSTEM_STACK}`;
    }

    // slot: 'left'(HOME側) / 'right'(AWAY側)。x は中央からの距離として扱う
    function spreadPos(baseLeft, slot, baseTop, key) {
      const b = blocks.value[key];
      const dx = slot === 'left' ? -b.x : b.x;
      return {
        left: (baseLeft + dx) + 'px',
        top: (baseTop + b.y) + 'px',
        fontSize: b.size + 'px',
        fontFamily: fontFamilyFor(key),
        color: b.color
      };
    }

    // ハイフン専用。位置は固定、色だけ隣接するブロックに合わせる
    function fixedPos(left, top, color) {
      return { left: left + 'px', top: top + 'px', background: color };
    }

    let lastSignature = '';
    function syncFontFaces() {
      const b = blocks.value;
      if (!b) return;

      const rules = [];
      const sigParts = [];
      for (const key of BLOCK_KEYS) {
        const font = b[key].font;
        sigParts.push(`${key}:${font}`);
        if (font && font !== 'system') {
          const encodedPath = font.split('/').map(encodeURIComponent).join('/');
          rules.push(
            `@font-face { font-family: "disp-font-${key}"; font-display: block;` +
            ` src: url("/fonts/${encodedPath}"); }`
          );
        }
      }

      const signature = sigParts.join('|');
      if (signature === lastSignature) return;
      lastSignature = signature;

      let el = document.getElementById('font-faces');
      if (!el) {
        el = document.createElement('style');
        el.id = 'font-faces';
        document.head.appendChild(el);
      }
      el.textContent = rules.join('\n');
    }

    // 短縮名が未設定ならチーム名にフォールバック(この画面だけの挙動)
    function displayName(team) {
      const s = state.value;
      if (!s) return '';
      return s[team].shortName || s[team].name;
    }

    // 確定済みのセットをすべて表示する(件数の上限なし)
    const results = computed(() => state.value ? state.value.setResults : []);

    function fit() {
      scale.value = Math.min(window.innerWidth / 1920, window.innerHeight / 1080, 1);
    }

    const socket = io();
    socket.on('state', (s) => {
      state.value = s;
      syncFontFaces();
    });
    socket.on('connect', () => { connected.value = true; });
    socket.on('disconnect', () => { connected.value = false; });

    onMounted(() => { fit(); window.addEventListener('resize', fit); });

    return { state, blocks, visible, scale, results, spreadPos, fixedPos, displayName };
  }
}).mount('#app');
</script>
</body>
</html>
