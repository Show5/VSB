<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>表示：試合結果</title>
<script src="/socket.io/socket.io.js"></script>
<script src="/vendor/vue.global.js"></script>
<style>
  [v-cloak] { display: none; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%;
               background: transparent; overflow: hidden; }
  #stage {
    position: absolute; top: 0; left: 0; width: 1920px; height: 1080px;
    transform-origin: top left;
    font-variant-numeric: tabular-nums;
    opacity: 0; transition: opacity 0.4s ease;
  }
  #stage.ready { opacity: 1; }
  .abs { position: absolute; display: flex; }
  .name { width: 792px; height: 165px; align-items: center; justify-content: center;
          font-weight: 700; line-height: 1.15; text-align: center;
          overflow: hidden; word-break: break-word; white-space: pre-line; }
  .setsnum { width: 330px; height: 450px; align-items: center; justify-content: center;
             font-weight: 800; line-height: 1; }
  .rownum { width: 138px; height: 90px; align-items: center; justify-content: center;
            font-weight: 700; line-height: 1; }
  .rowdash { width: 47px; height: 10px; }
</style>
</head>
<body>

<div id="app" v-cloak>
  <div id="stage" :class="{ ready: visible }" :style="{ transform: `scale(${scale})` }">
    <template v-if="state">

      <!-- チーム名(短縮ではなく通常の名前) -->
      <div class="abs name" :style="spreadPos(89, 'left', 39, 'name')">{{ state.home.name }}</div>
      <div class="abs name" :style="spreadPos(1033, 'right', 39, 'name')">{{ state.away.name }}</div>

      <!-- 獲得セット数。左右の外側に配置。初期値は 0(state.home/away.setsWon をそのまま表示) -->
      <div class="abs setsnum" :style="spreadPos(300, 'left', 338, 'setsWon')">{{ state.home.setsWon }}</div>
      <div class="abs setsnum" :style="spreadPos(1250, 'right', 338, 'setsWon')">{{ state.away.setsWon }}</div>

      <!-- セット結果。行数に応じてブロック全体を中央(RESULTS_CENTER_Y)に揃える -->
      <template v-for="(r, i) in results" :key="i">
        <div class="abs rownum" :style="spreadPos(771, 'left', rowTop(i), 'table')">{{ r.home }}</div>
        <div class="abs rowdash" :style="fixedPos(933, rowTop(i) + 40, blocks.table.color)"></div>
        <div class="abs rownum" :style="spreadPos(1000, 'right', rowTop(i), 'table')">{{ r.away }}</div>
      </template>

    </template>
  </div>
</div>

<script>
const { createApp, ref, computed, onMounted } = Vue;

const DISPLAY_ID = 'result';
const SYSTEM_STACK = '"Helvetica Neue", "Avenir Next", "Hiragino Sans", sans-serif';
const BLOCK_KEYS = ['name', 'setsWon', 'table'];

// セット結果の行の並び。PDFの実測値(行高90・行間109)をそのまま使う
const ROW_HEIGHT = 90;
const ROW_PITCH = 109;
// 獲得セット数の縦の中心と揃えることで、1つの帯として見えるようにしている
const RESULTS_CENTER_Y = 562;

createApp({
  setup() {
    const state = ref(null);
    const connected = ref(false);
    const scale = ref(1);

    const conf = computed(() => state.value ? state.value.displays[DISPLAY_ID] : null);
    const blocks = computed(() => conf.value ? conf.value.blocks : null);
    const visible = computed(() => connected.value && state.value !== null);

    function fontFamilyFor(key) {
      const b = blocks.value[key];
      if (!b || !b.font || b.font === 'system') return SYSTEM_STACK;
      return `"disp-font-${key}", ${SYSTEM_STACK}`;
    }

    // slot: 'left'(HOME側) / 'right'(AWAY側)。x は中央からの距離として扱う
    function spreadPos(baseLeft, slot, baseTop, key) {
      const b = blocks.value[key];
      const dx = slot === 'left' ? -b.x : b.x;
      return {
        left: (baseLeft + dx) + 'px',
        top: (baseTop + b.y) + 'px',
        fontSize: b.size + 'px',
        fontFamily: fontFamilyFor(key),
        color: b.color
      };
    }

    // ハイフン専用。位置は行位置に連動するが、縦位置の調整(y)の影響は受けない
    // (数字だけを動かし、ハイフンはその場に残す既存の仕様に合わせている)
    function fixedPos(left, top, color) {
      return { left: left + 'px', top: top + 'px', background: color };
    }

    // 確定済みのセットをすべて表示する(件数の上限なし、試合の途中でも自然に使える)
    const results = computed(() => state.value ? state.value.setResults : []);

    // n行ぶんのブロック高さを計算し、常に RESULTS_CENTER_Y を中心に配置する。
    // セット数が増減しても、ブロックはその時々の行数に応じて中央に寄る
    function rowTop(i) {
      const n = results.value.length;
      const blockHeight = (n - 1) * ROW_PITCH + ROW_HEIGHT;
      const blockTop = RESULTS_CENTER_Y - blockHeight / 2;
      return blockTop + i * ROW_PITCH;
    }

    let lastSignature = '';
    function syncFontFaces() {
      const b = blocks.value;
      if (!b) return;

      const rules = [];
      const sigParts = [];
      for (const key of BLOCK_KEYS) {
        const font = b[key].font;
        sigParts.push(`${key}:${font}`);
        if (font && font !== 'system') {
          const encodedPath = font.split('/').map(encodeURIComponent).join('/');
          rules.push(
            `@font-face { font-family: "disp-font-${key}"; font-display: block;` +
            ` src: url("/fonts/${encodedPath}"); }`
          );
        }
      }

      const signature = sigParts.join('|');
      if (signature === lastSignature) return;
      lastSignature = signature;

      let el = document.getElementById('font-faces');
      if (!el) {
        el = document.createElement('style');
        el.id = 'font-faces';
        document.head.appendChild(el);
      }
      el.textContent = rules.join('\n');
    }

    function fit() {
      scale.value = Math.min(window.innerWidth / 1920, window.innerHeight / 1080, 1);
    }

    const socket = io();
    // サーバーから 'state' が届くたびに反映する。得点・セット結果の変更は
    // すべてこの1本の経路で流れてくるので、特別な仕組みなしに即座に反映される
    socket.on('state', (s) => {
      state.value = s;
      syncFontFaces();
    });
    socket.on('connect', () => { connected.value = true; });
    socket.on('disconnect', () => { connected.value = false; });

    onMounted(() => { fit(); window.addEventListener('resize', fit); });

    return { state, blocks, visible, scale, results, rowTop, spreadPos, fixedPos };
  }
}).mount('#app');
</script>
</body>
</html>
