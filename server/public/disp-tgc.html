<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>表示：卒団式(TGC)</title>
<script src="/socket.io/socket.io.js"></script>
<script src="/vendor/vue.global.js"></script>
<style>
  [v-cloak] { display: none; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%;
               background: transparent; overflow: hidden; }
  #stage {
    position: absolute; top: 50%; left: 50%; width: 1920px; height: 1080px;
    font-variant-numeric: tabular-nums;
    opacity: 0; transition: opacity 0.4s ease;
  }
  #stage.ready { opacity: 1; }
  .abs { position: absolute; display: flex; }
  .tgc-score { width: 260px; height: 165px; align-items: center; justify-content: center;
               font-weight: 800; line-height: 1; }
  .tgc-lamp { width: 15px; height: 15px; box-sizing: border-box; }
  .tgc-pair { width: 160px; height: 100px; align-items: center; justify-content: center;
              font-weight: 700; line-height: 1; gap: 0.12em; }
  .tgc-pair svg { flex-shrink: 0; display: block; }

  .tgc-score.flip-anim {
    animation: score-flip 0.55s ease-in-out;
  }
  @keyframes score-flip {
    0%   { transform: perspective(400px) translateY(0)              rotateY(0deg); }
    25%  { transform: perspective(400px) translateY(var(--flip-lift)) rotateY(0deg); }
    75%  { transform: perspective(400px) translateY(var(--flip-lift)) rotateY(360deg); }
    100% { transform: perspective(400px) translateY(0)              rotateY(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tgc-score.flip-anim { animation: none; }
  }
</style>
</head>
<body>

<div id="app" v-cloak>
  <div id="stage" :class="{ ready: visible }" :style="{ transform: `translate(-50%, -50%) scale(${scale})` }">
    <template v-if="state">

      <div class="abs tgc-score" ref="homeScoreEl"
           :style="{ ...scorePos('home'), '--flip-lift': flipLift + 'px' }">{{ state.home.score }}</div>
      <div class="abs tgc-score" ref="awayScoreEl"
           :style="{ ...scorePos('away'), '--flip-lift': flipLift + 'px' }">{{ state.away.score }}</div>

      <div v-for="l in setsLamps" :key="l.key" class="abs tgc-lamp" :style="l.style"></div>

      <template v-for="c in counters" :key="c.key">
        <div class="abs tgc-pair" :style="c.style">
          <template v-if="c.team === 'home'">
            <span v-html="c.icon"></span><span>{{ c.value }}</span>
          </template>
          <template v-else>
            <span>{{ c.value }}</span><span v-html="c.icon"></span>
          </template>
        </div>
      </template>

    </template>
  </div>
</div>

<script>
const { createApp, ref, computed, onMounted } = Vue;

const DISPLAY_ID = 'tgc';
const SYSTEM_STACK = '"Helvetica Neue", "Avenir Next", "Hiragino Sans", sans-serif';
const BLOCK_KEYS = ['score', 'counter'];

const SCORE_CX = { home: 740, away: 1180 };
const LAMP_GAP = 77.5;
const LAMP_SIZE = 15;
const LAMP_PITCH = 20;
const LAMP_BOTTOM = 1068;

const ICON_CLOCK = '<svg viewBox="0 0 24 24" width="1em" height="1em"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3.2 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_REFRESH = '<svg viewBox="0 0 24 24" width="1em" height="1em"><path d="M4.5 12a7.5 7.5 0 0 1 12.6-5.5M19.5 12a7.5 7.5 0 0 1-12.6 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M17.5 3.5v4h-4M6.5 20.5v-4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_MONITOR = '<svg viewBox="0 0 24 24" width="1em" height="1em"><rect x="2" y="4" width="14.5" height="10.5" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5.5 17.5h7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="17.5" cy="15.5" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.7 17.7L22 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

const COUNTER_DEFS = [
  { kind: 'timeouts',   max: 'timeoutsPerSet',   icon: ICON_CLOCK,   cx: 848 },
  { kind: 'subs',       max: 'subsPerSet',       icon: ICON_REFRESH, cx: 656 },
  { kind: 'challenges', max: 'challengesPerSet', icon: ICON_MONITOR, cx: 455 }
];

const SCORE_DEFAULT_SIZE = 200;
const FLIP_LIFT = -(SCORE_DEFAULT_SIZE * 0.15);

createApp({
  setup() {
    const state = ref(null);
    const connected = ref(false);
    const scale = ref(1);
    const homeScoreEl = ref(null);
    const awayScoreEl = ref(null);

    let prevHomeScore = null;
    let prevAwayScore = null;

    function playFlip(el) {
      if (!el || !blocks.value || !blocks.value.score.animate) return;
      el.classList.remove('flip-anim');
      void el.offsetWidth;
      el.classList.add('flip-anim');
    }

    function detectScoreFlip(s) {
      if (prevHomeScore !== null && s.home.score > prevHomeScore) playFlip(homeScoreEl.value);
      if (prevAwayScore !== null && s.away.score > prevAwayScore) playFlip(awayScoreEl.value);
      prevHomeScore = s.home.score;
      prevAwayScore = s.away.score;
    }

    const conf = computed(() => state.value ? state.value.displays[DISPLAY_ID] : null);
    const blocks = computed(() => conf.value ? conf.value.blocks : null);
    const visible = computed(() => connected.value && state.value !== null);

    function fontFamilyFor(key) {
      const b = blocks.value[key];
      if (!b || !b.font || b.font === 'system') return SYSTEM_STACK;
      return `"disp-font-${key}", ${SYSTEM_STACK}`;
    }

    function scorePos(team) {
      const b = blocks.value.score;
      const slot = team === 'home' ? 'left' : 'right';
      const dx = slot === 'left' ? -b.x : b.x;
      const cx = SCORE_CX[team] + dx;
      return {
        left: (cx - 130) + 'px',
        top: (900 + b.y) + 'px',
        fontSize: b.size + 'px',
        fontFamily: fontFamilyFor('score'),
        color: b.color
      };
    }

    const setsLamps = computed(() => {
      const s = state.value;
      const b = blocks.value;
      if (!s || !b) return [];
      const score = b.score;
      const total = s.rules.format;
      const list = [];
      for (const team of ['home', 'away']) {
        const slot = team === 'home' ? 'left' : 'right';
        const dx = slot === 'left' ? -score.x : score.x;
        const cx = (team === 'home' ? 960 - LAMP_GAP : 960 + LAMP_GAP) + dx;
        const won = s[team].setsWon;
        for (let i = 0; i < total; i++) {
          const lit = i < won;
          const bottom = LAMP_BOTTOM - i * LAMP_PITCH;
          list.push({
            key: team + i,
            style: {
              left: (cx - LAMP_SIZE / 2) + 'px',
              top: (bottom - LAMP_SIZE + score.y) + 'px',
              width: LAMP_SIZE + 'px',
              height: LAMP_SIZE + 'px',
              background: lit ? score.setsColor : 'transparent',
              border: '2px solid ' + (lit ? score.setsColor : '#000')
            }
          });
        }
      }
      return list;
    });

    const counters = computed(() => {
      const s = state.value;
      const b = blocks.value;
      if (!s || !b) return [];
      const list = [];
      for (const team of ['home', 'away']) {
        const slot = team === 'home' ? 'left' : 'right';
        const dx = slot === 'left' ? -b.counter.x : b.counter.x;
        for (const c of COUNTER_DEFS) {
          const cd = s.rules.counterDisplay[c.kind];
          if (!cd.visible) continue;
          const used = s[team][c.kind];
          const max = s.rules[c.max];
          const cx = (team === 'home' ? 960 - c.cx : 960 + c.cx) + dx;
          list.push({
            key: team + c.kind,
            team,
            icon: c.icon,
            value: cd.mode === 'used' ? used : max - used,
            style: {
              left: (cx - 80) + 'px',
              top: (968 + b.counter.y) + 'px',
              fontSize: b.counter.size + 'px',
              fontFamily: fontFamilyFor('counter'),
              color: b.counter.color
            }
          });
        }
      }
      return list;
    });

    let lastSignature = '';
    function syncFontFaces() {
      const b = blocks.value;
      if (!b) return;

      const rules = [];
      const sigParts = [];
      for (const key of BLOCK_KEYS) {
        const font = b[key].font;
        sigParts.push(`${key}:${font}`);
        if (font && font !== 'system') {
          const encodedPath = font.split('/').map(encodeURIComponent).join('/');
          rules.push(
            `@font-face { font-family: "disp-font-${key}"; font-display: block;` +
            ` src: url("/fonts/${encodedPath}"); }`
          );
        }
      }

      const signature = sigParts.join('|');
      if (signature === lastSignature) return;
      lastSignature = signature;

      let el = document.getElementById('font-faces');
      if (!el) {
        el = document.createElement('style');
        el.id = 'font-faces';
        document.head.appendChild(el);
      }
      el.textContent = rules.join('\n');
    }

    function fit() {
      scale.value = Math.min(window.innerWidth / 1920, window.innerHeight / 1080, 1);
    }

    const socket = io();
    socket.on('state', (s) => {
      detectScoreFlip(s);
      state.value = s;
      syncFontFaces();
    });
    socket.on('connect', () => { connected.value = true; });
    socket.on('disconnect', () => { connected.value = false; });

    onMounted(() => { fit(); window.addEventListener('resize', fit); });

    return {
      state, blocks, visible, scale, setsLamps, counters, scorePos,
      homeScoreEl, awayScoreEl, flipLift: FLIP_LIFT
    };
  }
}).mount('#app');
</script>
</body>
</html>
