<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>得点入力</title>
<script src="/socket.io/socket.io.js"></script>
<script src="/vendor/vue.global.js"></script>
<link rel="stylesheet" href="/panel.css">
<style>
  .teams {
    display: grid;
    grid-template-columns: 1fr minmax(190px, 250px) 1fr;
    gap: 1rem; align-items: start;
  }
  .team { background: var(--panel); border-radius: 10px; padding: 1rem;
          border-top: 5px solid var(--line); }
  .team.home { border-top-color: var(--home); }
  .team.away { border-top-color: var(--away); }

  .name-label { flex-shrink: 0; width: 3.4rem; font-size: 0.8rem; color: var(--dim);
                padding-top: 0.55rem; }
  .name-row { display: flex; gap: 0.5rem; align-items: flex-start; margin-bottom: 0.5rem; }
  .name-input {
    flex: 1; min-width: 0; min-height: 2.3rem; resize: none; overflow: hidden;
    font-family: inherit; font-size: 1rem; line-height: 1.3;
    padding: 0.5rem; border-radius: 5px; border: 1px solid var(--line);
    background: #0f1115; color: var(--text);
  }
  .serve { width: 44px; height: 40px; background: #0f1115; color: var(--dim); font-size: 1.2rem; flex-shrink: 0; }
  .serve.active { background: var(--warn); color: #000; border-color: var(--warn); }

  .short-name-row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.75rem; }
  .short-name-input { flex: 1; min-width: 0; }

  .score { font-size: 5.5rem; font-weight: 700; text-align: center; line-height: 1; }
  .sets { text-align: center; color: var(--dim); margin-bottom: 0.75rem; }

  .score-btns { display: grid; grid-template-columns: 1fr 2fr; gap: 0.5rem; margin-bottom: 1rem; }
  .minus { font-size: 1.5rem; padding: 1rem; }
  .plus  { font-size: 2rem; padding: 1rem; font-weight: bold; }
  .home .plus { background: var(--home); border-color: var(--home); }
  .away .plus { background: var(--away); border-color: var(--away); }
  .plus:disabled { background: #2c313b; border-color: var(--line); color: var(--dim); }

  .counter { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
  .counter label { flex: 1; font-size: 0.95rem; transition: color 0.15s ease; }
  .counter label.maxed { color: var(--away); font-weight: bold; }
  .pips { display: flex; gap: 3px; flex-wrap: wrap; max-width: 110px; }
  .pip { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
  .pip.used { background: var(--warn); }
  .counter.is-maxed .pip.used { background: var(--away); }
  .counter button { width: 38px; height: 34px; font-size: 1.1rem; }

  .middle { background: var(--panel); border-radius: 10px; padding: 1rem; }
  .end-set { width: 100%; padding: 1.1rem 0.5rem; font-size: 1.05rem; }
  .end-set.ready { background: var(--ok); border-color: var(--ok); color: #000; font-weight: bold; }

  .results { margin-top: 1rem; }
  .results h3 { margin: 0 0 0.5rem; font-size: 0.8rem; color: var(--dim); font-weight: normal; }
  .results ol { list-style: none; margin: 0; padding: 0; }
  .results li { display: flex; align-items: baseline; gap: 0.5rem;
                padding: 0.4rem 0; border-bottom: 1px solid var(--line); }
  .results li:last-child { border-bottom: none; }
  .results .no { color: var(--dim); font-size: 0.8rem; width: 2.2rem; flex-shrink: 0; }
  .results .sc { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .results .empty { color: var(--dim); font-size: 0.85rem; }

  @media (max-width: 820px) { .teams { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="app" v-cloak>

  <div class="status" :class="connected ? 'on' : 'off'">
    {{ connected ? '接続済み' : '⚠ 切断されました — 操作は反映されません' }}
  </div>

  <template v-if="state">
    <div class="card" style="display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap">
      <b style="font-size:1.3rem">第{{ state.currentSet }}セット</b>
      <span class="hint">{{ target }}点先取</span>
      <span class="hint">{{ state.rules.format }}セットマッチ</span>
      <span v-if="state.finished" style="color:var(--ok);font-weight:bold">試合終了</span>
    </div>

    <div class="teams">

      <div class="team home">
        <div class="name-row">
          <label class="name-label">チーム名</label>
          <textarea class="name-input" rows="1" maxlength="60"
                    :value="state.home.name"
                    @input="growAll"
                    @change="send('team:rename', { team: 'home', name: $event.target.value })"></textarea>
          <button class="serve" :class="{ active: state.servingTeam === 'home' }"
                  @click="send('serve:set', { team: 'home' })">S</button>
        </div>
        <div class="short-name-row">
          <label class="name-label">チーム名<br>（短縮）</label>
          <input type="text" class="short-name-input" maxlength="10"
                 :value="state.home.shortName"
                 @change="send('team:shortname', { team: 'home', shortName: $event.target.value })">
        </div>
        <div class="score">{{ state.home.score }}</div>
        <div class="sets">セット {{ state.home.setsWon }}</div>
        <div class="score-btns">
          <button class="minus" @click="send('score:add', { team: 'home', delta: -1 })">−</button>
          <button class="plus" :disabled="!canAdd('home')"
                  :title="canAdd('home') ? '' : '2点差で決着しています。セット確定を押してください'"
                  @click="send('score:add', { team: 'home', delta: 1 })">+1</button>
        </div>
        <div v-for="c in counterDefs" :key="c.kind" class="counter"
             :class="{ 'is-maxed': isMaxed('home', c) }">
          <label :class="{ maxed: isMaxed('home', c) }">{{ c.label }}</label>
          <div class="pips">
            <div v-for="n in state.rules[c.max]" :key="n"
                 class="pip" :class="{ used: n <= state.home[c.kind] }"></div>
          </div>
          <button :disabled="state.home[c.kind] <= 0"
                  @click="send('counter:undo', { team: 'home', kind: c.kind })">−</button>
          <button :disabled="state.home[c.kind] >= state.rules[c.max]"
                  @click="send('counter:use', { team: 'home', kind: c.kind })">+</button>
        </div>
      </div>

      <div class="middle">
        <button class="end-set" :class="{ ready: setReady }"
                :disabled="state.finished" @click="endSet">セット確定</button>

        <div class="results">
          <h3>セット結果</h3>
          <p v-if="!state.setResults.length" class="empty">まだありません</p>
          <ol v-else>
            <li v-for="r in state.setResults" :key="r.set">
              <span class="no">第{{ r.set }}</span>
              <span class="sc">{{ r.home }} − {{ r.away }}</span>
            </li>
          </ol>
        </div>
      </div>

      <div class="team away">
        <div class="name-row">
          <label class="name-label">チーム名</label>
          <textarea class="name-input" rows="1" maxlength="60"
                    :value="state.away.name"
                    @input="growAll"
                    @change="send('team:rename', { team: 'away', name: $event.target.value })"></textarea>
          <button class="serve" :class="{ active: state.servingTeam === 'away' }"
                  @click="send('serve:set', { team: 'away' })">S</button>
        </div>
        <div class="short-name-row">
          <label class="name-label">チーム名<br>（短縮）</label>
          <input type="text" class="short-name-input" maxlength="10"
                 :value="state.away.shortName"
                 @change="send('team:shortname', { team: 'away', shortName: $event.target.value })">
        </div>
        <div class="score">{{ state.away.score }}</div>
        <div class="sets">セット {{ state.away.setsWon }}</div>
        <div class="score-btns">
          <button class="minus" @click="send('score:add', { team: 'away', delta: -1 })">−</button>
          <button class="plus" :disabled="!canAdd('away')"
                  :title="canAdd('away') ? '' : '2点差で決着しています。セット確定を押してください'"
                  @click="send('score:add', { team: 'away', delta: 1 })">+1</button>
        </div>
        <div v-for="c in counterDefs" :key="c.kind" class="counter"
             :class="{ 'is-maxed': isMaxed('away', c) }">
          <label :class="{ maxed: isMaxed('away', c) }">{{ c.label }}</label>
          <div class="pips">
            <div v-for="n in state.rules[c.max]" :key="n"
                 class="pip" :class="{ used: n <= state.away[c.kind] }"></div>
          </div>
          <button :disabled="state.away[c.kind] <= 0"
                  @click="send('counter:undo', { team: 'away', kind: c.kind })">−</button>
          <button :disabled="state.away[c.kind] >= state.rules[c.max]"
                  @click="send('counter:use', { team: 'away', kind: c.kind })">+</button>
        </div>
      </div>

    </div>

    <div class="card hint" style="margin-top:1rem">
      <kbd>Q</kbd>/<kbd>A</kbd> 左チーム +1/-1 &nbsp;
      <kbd>O</kbd>/<kbd>L</kbd> 右チーム +1/-1
    </div>
  </template>
</div>

<script>
const { createApp, ref, computed, onMounted, onUnmounted, nextTick } = Vue;

const COUNTER_DEFS = [
  { kind: 'timeouts',   label: 'タイムアウト', max: 'timeoutsPerSet' },
  { kind: 'subs',       label: '選手交代',     max: 'subsPerSet' },
  { kind: 'challenges', label: 'チャレンジ',   max: 'challengesPerSet' }
];
const KEYS = { q: ['home', 1], a: ['home', -1], o: ['away', 1], l: ['away', -1] };

function growAll() {
  document.querySelectorAll('.name-input').forEach((el) => {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  });
}

createApp({
  setup() {
    const state = ref(null);
    const connected = ref(false);
    const socket = io();

    socket.on('state', (s) => {
      state.value = s;
      nextTick(growAll);
    });
    socket.on('connect', () => { connected.value = true; });
    socket.on('disconnect', () => { connected.value = false; });

    const send = (event, payload) => socket.emit(event, payload);

    const target = computed(() => {
      const s = state.value;
      if (!s) return 25;
      return s.currentSet === s.rules.format ? s.rules.finalSetPoints : s.rules.pointsToWin;
    });

    const setReady = computed(() => {
      const s = state.value;
      if (!s || s.finished) return false;
      const top = Math.max(s.home.score, s.away.score);
      const lead = Math.abs(s.home.score - s.away.score);
      return top >= target.value && lead >= 2;
    });

    function isMaxed(team, c) {
      const s = state.value;
      if (!s) return false;
      return s[team][c.kind] >= s.rules[c.max];
    }

    function canAdd(team) {
      const s = state.value;
      if (!s) return false;
      const opp = team === 'home' ? 'away' : 'home';
      const my = s[team].score;
      const oppScore = s[opp].score;
      if (my >= target.value && oppScore < my - 1) return false;
      return true;
    }

    function endSet() {
      const s = state.value;
      if (confirm(`第${s.currentSet}セットを ${s.home.score} − ${s.away.score} で確定します。よろしいですか？`)) {
        send('set:end');
      }
    }

    function onKey(e) {
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName) || e.metaKey || e.ctrlKey) return;
      const hit = KEYS[e.key.toLowerCase()];
      if (!hit) return;
      e.preventDefault();
      send('score:add', { team: hit[0], delta: hit[1] });
    }

    onMounted(() => document.addEventListener('keydown', onKey));
    onUnmounted(() => document.removeEventListener('keydown', onKey));

    return { state, connected, counterDefs: COUNTER_DEFS, target, setReady,
             isMaxed, canAdd, send, endSet, growAll };
  }
}).mount('#app');
</script>
</body>
</html>
